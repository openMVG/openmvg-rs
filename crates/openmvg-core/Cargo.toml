[package]
name = "openmvg-core"
description = "Camera models, identifiers, graphs, poses, typed units and deterministic seeds for OpenMVG-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/openmvg-core"
keywords = ["computer-vision", "geometry", "sfm", "camera"]
categories = ["algorithms", "computer-vision", "mathematics", "science::robotics"]
include = ["src/**", "examples/**", "figures/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
nalgebra = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }

[features]
default = []

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
