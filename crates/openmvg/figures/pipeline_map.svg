<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" width="100%" style="max-width:900px" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="currentColor" role="img" aria-labelledby="pm-title pm-desc">
<title id="pm-title">Map of the reconstruction pipeline at three zoom levels</title>
<desc id="pm-desc">Three rows: the calls an application makes, the algorithms inside them for one image pair, and the crate that owns each step.</desc>
<defs>
<marker id="pm-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="currentColor"/></marker>
</defs>
<text x="35" y="20" font-size="13"><tspan font-weight="bold">Application</tspan><tspan fill-opacity="0.75"> — what you call</tspan></text>
<g stroke="currentColor" stroke-width="1.5" fill="#3a86d4" fill-opacity="0.12">
<path d="M35,80 V32 H67 L73,38 H131 V80 Z"/>
<rect x="161" y="32" width="90" height="48" rx="6"/>
<rect x="351" y="32" width="104" height="48" rx="6"/>
<rect x="575" y="32" width="140" height="48" rx="6"/>
<path d="M745,32 H851 L865,46 V80 H745 Z"/>
</g>
<path d="M851,32 V46 H865" fill="none" stroke="currentColor" stroke-width="1.5"/>
<g text-anchor="middle">
<text x="83" y="55" font-size="13">folder of</text>
<text x="83" y="71" font-size="13">images</text>
<text x="805" y="55" font-size="13">PLY, COLMAP</text>
<text x="805" y="71" font-size="13">or OMVG files</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text x="206" y="61">Dataset</text>
<text x="403" y="61">ViewGraph</text>
<text x="645" y="61">Reconstruction</text>
<text x="301" y="49" font-size="13">Frontend</text>
<text x="515" y="49" font-size="13">Incremental</text>
<text x="515" y="74" font-size="13"><tspan font-family="system-ui, -apple-system, Segoe UI, sans-serif">or </tspan>Global</text>
</g>
</g>
<g stroke="currentColor" stroke-width="1.5" fill="none">
<line x1="131" y1="56" x2="159" y2="56" marker-end="url(#pm-ink)"/>
<line x1="251" y1="56" x2="349" y2="56" marker-end="url(#pm-ink)"/>
<line x1="455" y1="56" x2="573" y2="56" marker-end="url(#pm-ink)"/>
<line x1="715" y1="56" x2="743" y2="56" marker-end="url(#pm-ink)"/>
</g>
<g stroke="currentColor" fill="none" stroke-opacity="0.6">
<path d="M161,87 V92 H715 V87 M745,87 V92 H865 V87"/>
<path d="M301,62 V150 M515,80 V126 H727 V150" stroke-dasharray="4 4"/>
<path d="M35,158 V152 H565 V158 M589,158 V152 H865 V158"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill-opacity="0.85">
<text x="438" y="106">openmvg-sfm</text>
<text x="805" y="106" font-size="11">PLY: openmvg-sfm</text>
<text x="805" y="120" font-size="11">COLMAP, OMVG: openmvg-io</text>
</g>
<text x="35" y="141" font-size="13"><tspan font-weight="bold">Inside the steps</tspan><tspan fill-opacity="0.75"> — one image pair</tspan></text>
<g stroke="currentColor" stroke-width="1.5" fill="#d9731f" fill-opacity="0.12">
<rect x="35" y="164" width="110" height="52" rx="6"/>
<rect x="169" y="164" width="110" height="52" rx="6"/>
<rect x="303" y="164" width="128" height="52" rx="6"/>
<rect x="455" y="164" width="110" height="52" rx="6"/>
<rect x="589" y="164" width="112" height="52" rx="6"/>
<rect x="725" y="164" width="140" height="52" rx="6"/>
</g>
<g stroke="currentColor" stroke-width="1.5" fill="none">
<line x1="145" y1="190" x2="167" y2="190" marker-end="url(#pm-ink)"/>
<line x1="279" y1="190" x2="301" y2="190" marker-end="url(#pm-ink)"/>
<line x1="431" y1="190" x2="453" y2="190" marker-end="url(#pm-ink)"/>
<line x1="565" y1="190" x2="587" y2="190" marker-end="url(#pm-ink)"/>
<line x1="701" y1="190" x2="723" y2="190" marker-end="url(#pm-ink)"/>
</g>
<g text-anchor="middle">
<text x="90" y="186">features</text>
<text x="224" y="186">matching</text>
<text x="367" y="186">essential matrix</text>
<text x="510" y="186">relative pose</text>
<text x="645" y="186">triangulation</text>
<text x="795" y="186">bundle adjustment</text>
<g font-size="12" fill-opacity="0.8">
<text x="90" y="204">detect + describe</text>
<text x="224" y="204">+ ratio test</text>
<text x="367" y="204">robust (RANSAC)</text>
<text x="510" y="204"><tspan font-style="italic">R</tspan>, <tspan font-style="italic">t</tspan> from <tspan font-style="italic">E</tspan></text>
<text x="645" y="204">3D points</text>
<text x="795" y="204">refine poses + points</text>
</g>
</g>
<path d="M35,222 V228 H279 V222 M303,222 V228 H701 V222 M725,222 V228 H865 V222" stroke="currentColor" fill="none" stroke-opacity="0.6"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill-opacity="0.85">
<text x="157" y="243">openmvg-features</text>
<text x="502" y="243">openmvg-geometry</text>
<text x="795" y="243">openmvg-ba</text>
</g>
<rect x="35" y="260" width="830" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
<text x="450" y="280" text-anchor="middle" font-size="13"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">openmvg-core</tspan> — cameras, poses, IDs and units, shared by every crate</text>
</svg>
